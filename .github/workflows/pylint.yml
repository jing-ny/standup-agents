name: Pylint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install pylint
      run: pip install pylint
    # Errors-only: this repo ships one optional 30-line script; style
    # opinions aren't worth a red X on the template's front page.
    - name: Lint (errors only)
      run: pylint --errors-only $(git ls-files '*.py')
